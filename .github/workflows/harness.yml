name: Agent harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # テストは回さない (ci.yml と同じ方針)。生成したファイルが最新かどうかだけを見る。
  # ハーネスの回帰テスト (scripts/*.test.mjs) は、手元の `make check` で回す
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check generated Codex files
        run: node scripts/sync-codex-harness.mjs --check
