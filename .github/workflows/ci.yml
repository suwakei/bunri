name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # テストは回さない。ビルドが通るか・リントが通るかだけを最低限見る

  # ---- フロントエンド: リント → 型チェック → ビルド ----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ---- バックエンド: リント ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python の版は .python-version、依存は uv.lock のとおりに入れる
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # 本体の依存 (torch 等) は重いので入れず、dev グループ (ruff) だけ入れる
      - name: Install dependencies
        run: uv sync --frozen --only-dev

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

  # ---- デスクトップ (src-tauri): フォーマット → リント ----
  # mac で回す。Linux だと WebView のビルドに追加のシステムパッケージが要るため
  desktop:
    runs-on: macos-latest
    steps:
      # 音のエンジンが使う sfizz (third_party/sfizz) とその依存は submodule。clippy が
      # sfizz を cmake でビルドするので要る (cmake は macOS のランナーに入っている)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ビルドに要る同梱物 (uv のバイナリと runtime/) を用意する
      - name: Prepare bundled files
        run: node scripts/prepare-desktop.mjs

      - name: Format (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
