name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- フロントエンド: リント → 型チェック → テスト → ビルド ----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---- バックエンド: リント → テスト ----
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python の版は .python-version、依存は uv.lock のとおりに入れる
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run python -m pytest test/back/ -v --ignore=test/back/test_api.py --ignore=test/back/test_decompose.py

  # ---- デスクトップ (src-tauri): フォーマット → リント ----
  # mac で回す。Linux だと WebView のビルドに追加のシステムパッケージが要るため
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ビルドに要る同梱物 (uv のバイナリと runtime/) を用意する
      - name: Prepare bundled files
        run: node scripts/prepare-desktop.mjs

      - name: Format (cargo fmt)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint (cargo clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
