[package]
name = "bunri"
version = "0.1.0"
description = "bunri DAW のデスクトップアプリ (Tauri v2 の殻 + Python sidecar)"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "bunri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sidecar の状態 (起動中 / 待ち受け中 / 失敗) を待つための watch チャネルだけを使う
tokio = { version = "1", features = ["sync"] }
# 起動ごとのトークンを OS の乱数から作る
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
# 止めるとき、子プロセスが起動した孫までプロセスグループごと終わらせる
libc = "0.2"
