[package]
name = "bunri"
version = "0.1.0"
description = "bunri DAW のデスクトップアプリ (Tauri v2 の殻 + Python sidecar)"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "bunri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sidecar の状態 (起動中 / 待ち受け中 / 失敗) を待つための watch チャネルだけを使う
tokio = { version = "1", features = ["sync"] }
# 起動ごとのトークンを OS の乱数から作る
getrandom = "0.3"
keyring = "4.2"
midir = "0.11.1"
# テスト専用 (機能 e2e のときだけ入る)。窓を外から操作する WebDriver サーバを、アプリの中で動かす。
# 配布物には入れない。選んだ理由と守っている約束は docs/desktop-architecture.md「窓を自動操作するテスト」
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[features]
# 既定では何も足さない。e2e は make e2e-desktop が付けるだけで、ここ (default) には絶対に入れない
default = []
# 窓を自動操作するテスト用のビルド。WebDriver サーバ (認証の無い HTTP) をアプリの中で起動するので、
# 配布物 (release ビルド) では使えない (lib.rs の compile_error! で止める)
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[target.'cfg(unix)'.dependencies]
# 止めるとき、子プロセスが起動した孫までプロセスグループごと終わらせる
libc = "0.2"
