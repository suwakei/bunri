[package]
name = "bunri-audio"
version = "0.1.0"
description = "bunri の音のエンジン (曲を受け取って音を作る engine、sfizz によるサンプラー、オフライン描画)"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
# 音声デバイスへの出力 (output)
cpal = "0.18.2"
# WAV の読み書き (クリップの読み込みと、書き出し)
hound = "3.5"
# 画面の側と音声スレッドのあいだの、ロックの無いキュー (transport)
rtrb = "0.4.1"

[build-dependencies]
cmake = "0.1"
